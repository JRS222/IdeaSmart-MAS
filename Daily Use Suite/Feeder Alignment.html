<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feeder Alignment MMO-029-08</title>
    <style>
        /* ── reset & base ── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f4f6fa;
            color: #1e293b;
            padding: 20px;
        }

        .app {
            max-width: 1440px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 24px;
            min-height: 90vh;
            align-items: start;
        }
        @media (max-width: 860px) {
            .app {
                grid-template-columns: 1fr;
            }
        }

        /* ── sidebar ── */
        .sidebar {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 20px 16px;
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            border: 1px solid #e9edf2;
        }
        .sidebar h2 {
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #64748b;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eef2f6;
        }
        .step-nav-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            color: #475569;
            transition: background 0.15s, color 0.15s;
            margin-bottom: 2px;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .step-nav-item:hover {
            background: #f1f5f9;
        }
        .step-nav-item.active {
            background: #e6effa;
            color: #0b4b7a;
            font-weight: 600;
        }
        .step-nav-item .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 22px;
            height: 22px;
            border-radius: 6px;
            background: #e9edf2;
            font-size: 10px;
            font-weight: 700;
            color: #475569;
            padding: 0 5px;
            flex-shrink: 0;
        }
        .step-nav-item .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #d1d5db;
            transition: background 0.2s;
        }
        .step-nav-item .status-dot.pass {
            background: #22c55e;
        }
        .step-nav-item .status-dot.fail {
            background: #ef4444;
        }
        .step-nav-item .status-dot.info {
            background: #3b82f6;
        }
        .step-nav-item .status-dot.partial {
            background: #f59e0b;
        }

        /* ── main content ── */
        .main {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 28px 32px;
            border: 1px solid #e9edf2;
        }

        .doc-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eef2f6;
        }
        .doc-header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #0f172a;
        }
        .doc-header .meta {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }
        .doc-header .meta span {
            display: inline-block;
            margin-right: 20px;
        }
        .doc-header .status-summary {
            display: flex;
            gap: 20px;
            font-size: 13px;
            background: #f8fafc;
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid #e9edf2;
        }
        .doc-header .status-summary .count {
            font-weight: 600;
        }

        .step-card {
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .step-card .step-number {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .step-card .step-title {
            font-size: 20px;
            font-weight: 600;
            margin: 4px 0 12px;
            color: #0f172a;
        }
        .step-card .step-desc {
            font-size: 14px;
            color: #334155;
            background: #f8fafc;
            padding: 14px 18px;
            border-radius: 12px;
            border-left: 4px solid #3b82f6;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .substep-box {
            background: #f8fafc;
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid #e9edf2;
        }
        .substep-box .label {
            font-weight: 600;
            font-size: 13px;
            color: #475569;
            margin-bottom: 8px;
        }
        .substep-box ul {
            margin: 0;
            padding-left: 20px;
            font-size: 14px;
            color: #1e293b;
            line-height: 1.6;
        }
        .substep-box ul li {
            margin-bottom: 2px;
        }

        .tools-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
        .tools-pills .label {
            font-weight: 500;
            font-size: 13px;
            color: #475569;
            margin-right: 8px;
            display: flex;
            align-items: center;
        }
        .tools-pills .pill {
            background: #eef2f6;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: #1e293b;
            border: 1px solid #e2e8f0;
        }

        .input-area {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px 24px;
            margin-bottom: 20px;
        }
        .input-area label {
            font-weight: 500;
            font-size: 14px;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-area .value-input {
            width: 130px;
            padding: 10px 14px;
            border: 2px solid #d1d9e6;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #ffffff;
        }
        .input-area .value-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .input-area .value-input.pass {
            border-color: #22c55e;
            background: #f0fdf4;
        }
        .input-area .value-input.fail {
            border-color: #ef4444;
            background: #fef2f2;
        }
        .input-area .unit {
            font-size: 15px;
            color: #64748b;
            font-weight: 500;
        }
        .input-area .tolerance {
            font-size: 13px;
            color: #64748b;
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .input-area .tolerance .range {
            font-weight: 600;
            color: #0f172a;
        }

        .feedback {
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
            border: 1px solid transparent;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .feedback.pass {
            background: #f0fdf4;
            border-color: #86efac;
            color: #166534;
        }
        .feedback.fail {
            background: #fef2f2;
            border-color: #fca5a5;
            color: #991b1b;
        }
        .feedback.info {
            background: #eff6ff;
            border-color: #93c5fd;
            color: #1e3a8a;
        }
        .feedback .icon {
            font-size: 20px;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .notes-area textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d9e6;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 60px;
            transition: border-color 0.2s;
        }
        .notes-area textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .notes-area label {
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            display: block;
            margin-bottom: 4px;
        }

        .step-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #eef2f6;
            flex-wrap: wrap;
            gap: 12px;
        }
        .step-nav .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .step-nav .btn:active {
            transform: scale(0.97);
        }
        .step-nav .btn-primary {
            background: #0b4b7a;
            color: #fff;
        }
        .step-nav .btn-primary:hover {
            background: #0a3d63;
        }
        .step-nav .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .step-nav .btn-secondary {
            background: #f1f5f9;
            color: #1e293b;
        }
        .step-nav .btn-secondary:hover {
            background: #e2e8f0;
        }
        .step-nav .btn-success {
            background: #22c55e;
            color: #fff;
        }
        .step-nav .btn-success:hover {
            background: #16a34a;
        }
        .step-nav .progress-text {
            font-size: 13px;
            color: #64748b;
            font-weight: 500;
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin: 28px 0 16px;
            border-bottom: 1px solid #eef2f6;
        }
        .tabs button {
            padding: 10px 20px;
            border: none;
            background: transparent;
            font-weight: 500;
            font-size: 14px;
            color: #64748b;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: color 0.15s, border-color 0.15s;
        }
        .tabs button:hover {
            color: #0f172a;
        }
        .tabs button.active {
            color: #0b4b7a;
            border-bottom-color: #0b4b7a;
        }
        .tab-content {
            display: none;
            animation: fadeIn 0.2s ease;
        }
        .tab-content.active {
            display: block;
        }

        .table-wrap {
            overflow-x: auto;
            margin-top: 8px;
            border-radius: 12px;
            border: 1px solid #e9edf2;
        }
        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .history-table th {
            background: #f8fafc;
            padding: 10px 12px;
            text-align: left;
            font-weight: 600;
            color: #475569;
            border-bottom: 1px solid #e9edf2;
            white-space: nowrap;
        }
        .history-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }
        .history-table tr:hover td {
            background: #fafcff;
        }
        .history-table .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .history-table .status-badge.pass {
            background: #dcfce7;
            color: #166534;
        }
        .history-table .status-badge.fail {
            background: #fee2e2;
            color: #991b1b;
        }
        .history-table .status-badge.partial {
            background: #fef3c7;
            color: #92400e;
        }
        .history-table .btn-sm {
            padding: 4px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            background: #eef2f6;
            color: #1e293b;
            transition: background 0.1s;
        }
        .history-table .btn-sm:hover {
            background: #d1d9e6;
        }
        .history-table .btn-sm.danger {
            background: #fee2e2;
            color: #991b1b;
        }
        .history-table .btn-sm.danger:hover {
            background: #fecaca;
        }
        .no-history {
            padding: 40px 20px;
            text-align: center;
            color: #94a3b8;
            font-size: 15px;
        }
        .no-history .big-icon {
            font-size: 40px;
            display: block;
            margin-bottom: 12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stats-grid .stat-card {
            background: #f8fafc;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #e9edf2;
            text-align: center;
        }
        .stats-grid .stat-card .num {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
        }
        .stats-grid .stat-card .label {
            font-size: 12px;
            color: #64748b;
            margin-top: 2px;
        }
        .stats-grid .stat-card .num.green {
            color: #22c55e;
        }
        .stats-grid .stat-card .num.red {
            color: #ef4444;
        }
        .stats-grid .stat-card .num.amber {
            color: #f59e0b;
        }

        .chart-container {
            background: #fafcff;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #e9edf2;
            margin-top: 12px;
            min-height: 280px;
            position: relative;
        }
        .chart-container canvas {
            width: 100% !important;
            height: auto !important;
            max-height: 320px;
        }
        .chart-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
            align-items: center;
        }
        .chart-controls select,
        .chart-controls input {
            padding: 6px 12px;
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            font-size: 13px;
            background: #fff;
        }

        .export-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }
        .export-bar .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            background: #f1f5f9;
            color: #1e293b;
            transition: background 0.15s;
        }
        .export-bar .btn:hover {
            background: #e2e8f0;
        }
        .export-bar .btn-primary {
            background: #0b4b7a;
            color: #fff;
        }
        .export-bar .btn-primary:hover {
            background: #0a3d63;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .text-muted {
            color: #94a3b8;
            font-size: 13px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .mt-8 {
            margin-top: 8px;
        }
        @media (max-width: 600px) {
            .main {
                padding: 16px;
            }
            .doc-header {
                flex-direction: column;
                gap: 12px;
            }
            .doc-header .status-summary {
                width: 100%;
                justify-content: space-around;
            }
            .input-area {
                flex-direction: column;
                align-items: stretch;
            }
            .input-area .value-input {
                width: 100%;
            }
            .step-nav {
                flex-direction: column;
                align-items: stretch;
            }
            .step-nav .btn {
                justify-content: center;
            }
            .sidebar {
                position: static;
                max-height: none;
            }
        }
        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #d1d9e6;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="app" id="app">

        <!-- ─── SIDEBAR ─── -->
        <aside class="sidebar" id="sidebar">
            <h2>📋 All Steps</h2>
            <div id="stepNavList"></div>
            <div style="margin-top:20px;padding-top:16px;border-top:1px solid #eef2f6;font-size:12px;color:#94a3b8;">
                <span id="totalStepsDisplay">0 steps</span>
                <span style="float:right;" id="completedDisplay">0 / 0</span>
            </div>
        </aside>

        <!-- ─── MAIN ─── -->
        <main class="main">

            <!-- header -->
            <div class="doc-header">
                <div>
                    <h1>Feeder Alignment &amp; Performance</h1>
                    <div class="meta">
                        <span>📄 MMO‑029‑08</span>
                        <span>📅 March 19, 2008</span>
                        <span>🏷️ DBCS Phases 2‑5</span>
                    </div>
                </div>
                <div class="status-summary" id="headerSummary">
                    <span>✅ <span class="count" id="hPass">0</span> pass</span>
                    <span>❌ <span class="count" id="hFail">0</span> fail</span>
                    <span>⏳ <span class="count" id="hPending">0</span> pending</span>
                </div>
            </div>

            <!-- machine info -->
            <div style="display:flex;flex-wrap:wrap;gap:12px 20px;margin-bottom:20px;background:#f8fafc;padding:12px 18px;border-radius:12px;border:1px solid #e9edf2;">
				<label style="font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;">
				  🖥️ Acronym
				  <select id="machineAcronym" style="border:1px solid #d1d9e6;border-radius:6px;padding:4px 8px;font-size:13px;">
					<option>DBCS</option><option>DIOSS</option><option>CIOSS</option>
				  </select>
				</label>
				<label style="font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;">
				  #
				  <input type="text" id="machineMno" value="49" inputmode="numeric" pattern="[0-9]*" style="border:1px solid #d1d9e6;border-radius:6px;padding:4px 10px;font-size:13px;width:70px;" />
				</label>
				<button class="btn" id="viewHistoryBtn" style="padding:5px 14px;font-size:12.5px;background:#4f46e5;">📜 View history</button>
                <label style="font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;">
                    👤 Tech
                    <input type="text" id="techName" value="J. Doe" style="border:1px solid #d1d9e6;border-radius:6px;padding:4px 10px;font-size:13px;width:120px;" />
                </label>
                <label style="font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;">
                    📅 Date
                    <input type="date" id="runDate" style="border:1px solid #d1d9e6;border-radius:6px;padding:4px 10px;font-size:13px;" />
                </label>
                <button class="btn btn-success" id="sendHistBtn" style="background:#22c55e;color:#fff;border:0;border-radius:6px;padding:6px 14px;cursor:pointer;font-weight:600;">📤 Send to Historian</button>
                <button class="btn btn-success" style="margin-left:auto;padding:6px 18px;font-size:13px;" id="saveRunBtn">💾 Save Run</button>
            </div>
			<!-- History drawer -->
			<div id="historyPanel" style="display:none;background:#fff;border:1px solid #e9edf2;border-radius:12px;padding:14px 18px;margin:0 0 14px;">
			  <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
				<strong id="histTitle" style="color:#0b3d91;">History</strong>
				<span class="text-muted" id="histSubtitle" style="font-size:12px;color:#64748b;"></span>
				<div style="margin-left:auto;display:flex;gap:8px;">
				  <button class="btn" id="histPrintBtn" style="padding:5px 12px;font-size:12px;background:#0b3d91;color:#fff;border:0;border-radius:6px;">🖨 Print</button>
				  <button class="btn" id="histCloseBtn" style="padding:5px 12px;font-size:12px;background:#f1f5f9;border:1px solid #d1d9e6;border-radius:6px;">Close</button>
				</div>
			  </div>
			  <div id="historyBody"></div>
</div>

            <!-- ─── STEP CONTENT ─── -->
            <div id="stepContent" class="step-card"></div>

            <!-- ─── TABS ─── -->
            <div class="tabs">
                <button class="active" data-tab="history">📊 History</button>
                <button data-tab="dashboard">📈 Dashboard</button>
            </div>

            <div id="tab-history" class="tab-content active">
                <div class="flex-between mb-8">
                    <span class="text-muted">Saved alignment runs</span>
                    <div style="display:flex;gap:8px;">
                        <button class="btn btn-sm" id="exportCsvBtn" style="background:#f1f5f9;border:none;padding:4px 14px;border-radius:20px;font-size:12px;cursor:pointer;">⬇ CSV</button>
                        <button class="btn btn-sm" id="clearHistoryBtn" style="background:#fee2e2;color:#991b1b;border:none;padding:4px 14px;border-radius:20px;font-size:12px;cursor:pointer;">🗑 Clear</button>
                    </div>
                </div>
                <div id="historyContainer"><div class="no-history"><span class="big-icon">📭</span>No saved runs yet.</div></div>
            </div>

            <div id="tab-dashboard" class="tab-content">
                <div class="stats-grid" id="statsGrid"></div>
                <div class="chart-controls">
                    <label style="font-size:13px;font-weight:500;">Step
                        <select id="chartStepSelect"></select>
                    </label>
                    <label style="font-size:13px;font-weight:500;">Metric
                        <select id="chartMetricSelect">
                            <option value="value">Value</option>
                            <option value="status">Status</option>
                        </select>
                    </label>
                </div>
                <div class="chart-container"><canvas id="trendChart" height="280"></canvas></div>
                <div class="export-bar">
                    <button class="btn btn-primary" id="exportJsonBtn">📥 Export JSON</button>

            renderStep(currentStepIndex);
            renderHistory();
            renderDashboard();
            populateChartSelect();
            bindEvents();
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  VALIDATION
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function validateStep(step, val) {
            if (!step.isMeasurable) return { status: 'info', message: 'Review substeps and tools.' };
            if (val === undefined || val === null || val === '') return { status: 'pending', message: 'Enter a value.' };
            const num = parseFloat(val);
            if (isNaN(num)) return { status: 'pending', message: 'Enter a valid number.' };

            if (step.isLevel) {
                const ok = Math.abs(num) <= 0.5;
                return { status: ok ? 'pass' : 'fail', message: ok ? '✅ Level (±0.5)' : '❌ Not level – adjust shims' };
            }
            if (step.isGapSwitch) {
                const ok = num === step.target;
                return { status: ok ? 'pass' : 'fail', message: ok ? '✅ Correct' : `❌ Must be ${step.target}` };
            }
            if (step.exact) {
                const ok = Math.abs(num - step.target) < 0.01;
                return {
                    status: ok ? 'pass' : 'fail',
                    message: ok ? `✅ Exactly ${step.target}${step.unit?' '+step.unit:''}` :
                        `❌ Must be exactly ${step.target}${step.unit?' '+step.unit:''}`
                };
            }
            if (num >= step.min && num <= step.max) {
                return { status: 'pass', message: `✅ Within tolerance (${step.min}–${step.max} ${step.unit})` };
            }
            return { status: 'fail', message: `❌ Out of range. Expected ${step.min}–${step.max} ${step.unit}.` };
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  RENDER STEP
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function renderStep(index) {
            const step = STEPS[index];
            if (!step) return;
            const container = document.getElementById('stepContent');
            const saved = stepValues[step.id] || {};
            const val = saved.value !== undefined ? saved.value : '';
            const notes = saved.notes || '';
            const validation = validateStep(step, val);
            const status = validation.status;

            // substeps
            let substepsHtml = '';
            if (step.substeps && step.substeps.length) {
                substepsHtml = `<div class="substep-box">
              <div class="label">📋 Procedure Substeps</div>
              <ul>${step.substeps.map(s => `<li>${s}</li>`).join('')}</ul>
            </div>`;
            }

            // tools
            let toolsHtml = '';
            if (step.tools && step.tools.length) {
                toolsHtml = `<div class="tools-pills">
              <span class="label">🔧 Tools:</span>
              ${step.tools.map(t => `<span class="pill">${t}</span>`).join('')}
            </div>`;
            }

            // input
            let inputHtml = '';
            let feedbackHtml = '';
            if (step.isMeasurable) {
                const rangeStr = step.isLevel ? 'level (±0.5)' :
                    step.isGapSwitch ? `= ${step.target}` :
                    step.exact ? `= ${step.target} ${step.unit}` :
                    `${step.min} – ${step.max} ${step.unit}`;
                inputHtml = `<div class="input-area">
              <label>Value (${step.unit})
                <input type="number" step="0.01" class="value-input ${status}" id="stepInput" value="${val}" placeholder="${step.target}" />
              </label>
              <span class="tolerance">Target: <span class="range">${step.target}</span>  •  ${rangeStr}</span>
            </div>`;

                if (status === 'pass') feedbackHtml =
                    `<div class="feedback pass"><span class="icon">✅</span> ${validation.message}</div>`;
                else if (status === 'fail') feedbackHtml =
                    `<div class="feedback fail"><span class="icon">❌</span> ${validation.message}</div>`;
                else feedbackHtml =
                    `<div class="feedback" style="background:#f8fafc;border-color:#d1d9e6;color:#64748b;"><span class="icon">⏳</span> Enter a value to check against tolerance.</div>`;
            } else {
                inputHtml =
                    `<div style="background:#f1f5f9;padding:12px 18px;border-radius:12px;color:#475569;font-size:14px;border:1px solid #e9edf2;">ℹ️ Informational step – review substeps and tools, then proceed.</div>`;
                if (status === 'info') feedbackHtml =
                    `<div class="feedback info"><span class="icon">ℹ️</span> ${validation.message}</div>`;
                else feedbackHtml =
                    `<div class="feedback info"><span class="icon">ℹ️</span> Review the information above.</div>`;
            }

            container.innerHTML = `
            <div class="step-number">Step ${step.id.replace('step','')}</div>
            <div class="step-title">${step.label}</div>
            <div class="step-desc">${step.desc}</div>
            ${substepsHtml}
            ${toolsHtml}
            ${inputHtml}
            ${feedbackHtml}
            <div class="notes-area">
              <label>📝 Notes (optional)</label>
              <textarea id="stepNotes" placeholder="Observations, adjustments made, parts replaced…">${notes}</textarea>
            </div>
            <div class="step-nav">
              <button class="btn btn-secondary" id="prevStepBtn" ${index===0?'disabled':''}>← Previous</button>
              <span class="progress-text">${index+1} / ${STEPS.length}</span>
              <button class="btn btn-primary" id="nextStepBtn" ${index===STEPS.length-1?'disabled':''}>Next →</button>
            </div>
          `;

            // bind input events
            const input = document.getElementById('stepInput');
            const notesArea = document.getElementById('stepNotes');
            if (input) {
                input.addEventListener('input', () => {
                    const v = input.value;
                    const parsed = parseFloat(v);
                    const valid = isNaN(parsed) ? undefined : parsed;
                    const result = validateStep(step, valid);
                    stepValues[step.id] = {
                        value: valid !== undefined ? valid : v,
                        notes: notesArea ? notesArea.value : '',
                        status: result.status,
                        timestamp: new Date().toISOString()
                    };
                    input.className = `value-input ${result.status}`;
                    const fb = container.querySelector('.feedback');
                    if (fb) {
                        const newFb = document.createElement('div');
                        if (result.status === 'pass') {
                            newFb.className = 'feedback pass';
                            newFb.innerHTML = `<span class="icon">✅</span> ${result.message}`;
                        } else if (result.status === 'fail') {
                            newFb.className = 'feedback fail';
                            newFb.innerHTML = `<span class="icon">❌</span> ${result.message}`;
                        } else {
                            newFb.className = 'feedback';
                            newFb.style.cssText = 'background:#f8fafc;border-color:#d1d9e6;color:#64748b;';
                            newFb.innerHTML = `<span class="icon">⏳</span> Enter a value to check against tolerance.`;
                        }
                        fb.replaceWith(newFb);
                    }
                    saveStepValues();
                    updateSidebarStatus();
                    updateHeaderSummary();
                });
            }
            if (notesArea) {
                notesArea.addEventListener('input', () => {
                    if (stepValues[step.id]) {
                        stepValues[step.id].notes = notesArea.value;
                        stepValues[step.id].timestamp = new Date().toISOString();
                        saveStepValues();
                    }
                });
            }

            document.getElementById('prevStepBtn').addEventListener('click', () => {
                if (index > 0) { currentStepIndex = index - 1;
                    renderStep(currentStepIndex);
                    updateSidebarActive(); }
            });
            document.getElementById('nextStepBtn').addEventListener('click', () => {
                if (index < STEPS.length - 1) { currentStepIndex = index + 1;
                    renderStep(currentStepIndex);
                    updateSidebarActive(); }
            });

            updateSidebarActive();
            updateHeaderSummary();
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  SIDEBAR
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function renderSidebar() {
            const list = document.getElementById('stepNavList');
            list.innerHTML = '';
            STEPS.forEach((step, i) => {
                const saved = stepValues[step.id] || {};
                const status = saved.status || 'pending';
                let dotClass = 'partial';
                if (status === 'pass') dotClass = 'pass';
                else if (status === 'fail') dotClass = 'fail';
                else if (status === 'info') dotClass = 'info';
                else dotClass = 'partial';

                const div = document.createElement('button');
                div.className = `step-nav-item ${i === currentStepIndex ? 'active' : ''}`;
                div.innerHTML = `
              <span class="badge">${i+1}</span>
              <span style="flex:1;font-size:11px;line-height:1.2;">${step.label.replace(/^[\d]+\.\s*/,'')}</span>
              <span class="status-dot ${dotClass}"></span>
            `;
                div.addEventListener('click', () => {
                    currentStepIndex = i;
                    renderStep(i);
                    updateSidebarActive();
                });
                list.appendChild(div);
            });
            document.getElementById('totalStepsDisplay').textContent = `${STEPS.length} steps`;
            updateSidebarStatus();
        }

        function updateSidebarActive() {
            document.querySelectorAll('.step-nav-item').forEach((el, i) => {
                el.classList.toggle('active', i === currentStepIndex);
            });
        }

        function updateSidebarStatus() {
            document.querySelectorAll('.step-nav-item').forEach((el, i) => {
                const step = STEPS[i];
                const saved = stepValues[step.id] || {};
                const status = saved.status || 'pending';
                const dot = el.querySelector('.status-dot');
                if (dot) {
                    let cls = 'partial';
                    if (status === 'pass') cls = 'pass';
                    else if (status === 'fail') cls = 'fail';
                    else if (status === 'info') cls = 'info';
                    dot.className = `status-dot ${cls}`;
                }
            });
            const total = STEPS.length;
            const done = STEPS.filter(s => {
                const v = stepValues[s.id];
                return v && (v.status === 'pass' || v.status === 'info');
            }).length;
            document.getElementById('completedDisplay').textContent = `${done} / ${total}`;
        }

        function updateHeaderSummary() {
            let pass = 0,
                fail = 0,
                pending = 0;
            STEPS.forEach(s => {
                const v = stepValues[s.id];
                if (!v || v.status === 'pending') pending++;
                else if (v.status === 'pass' || v.status === 'info') pass++;
                else if (v.status === 'fail') fail++;
            });
            document.getElementById('hPass').textContent = pass;
            document.getElementById('hFail').textContent = fail;
            document.getElementById('hPending').textContent = pending;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  STORAGE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function saveStepValues() {
            try { localStorage.setItem('feeder_align_draft', JSON.stringify(stepValues)); } catch (e) {}
        }

        function loadStepValues() {
            try {
                const raw = localStorage.getItem('feeder_align_draft');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    const known = new Set(STEPS.map(s => s.id));
                    for (const key of Object.keys(parsed)) {
                        if (known.has(key)) stepValues[key] = parsed[key];
                    }
                }
            } catch (e) {}
            STEPS.forEach(s => {
                if (!stepValues[s.id]) {
                    stepValues[s.id] = { value: undefined, notes: '', status: 'pending', timestamp: null };
                }
            });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  HISTORY
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function loadHistory() {
            try { const raw = localStorage.getItem('feeder_align_history'); if (raw) history = JSON.parse(raw); } catch (
            e) { history = []; }
            if (!Array.isArray(history)) history = [];
        }

        function saveHistory() {
            try { localStorage.setItem('feeder_align_history', JSON.stringify(history)); } catch (e) {}
        }

        function addHistoryRun() {
            const machineId = feaderAlignmentMachineId().canonical;
            const tech = document.getElementById('techName').value.trim() || 'J. Doe';
            const date = document.getElementById('runDate').value || new Date().toISOString().split('T')[0];
            const steps = {};
            let allPass = true,
                anyFail = false;
            STEPS.forEach(s => {
                const v = stepValues[s.id] || {};
                const status = v.status || 'pending';
                if (status === 'fail') { anyFail = true;
                    allPass = false; }
                if (status === 'pending' && s.isMeasurable) allPass = false;
                steps[s.id] = {
                    value: v.value !== undefined ? v.value : null,
                    notes: v.notes || '',
                    status: status
                };
            });
            const overall = allPass ? 'pass' : anyFail ? 'fail' : 'partial';
            const run = { id: Date.now().toString(36) + Math.random().toString(36).substr(2, 4), machineId, tech, date,
                timestamp: new Date().toISOString(), steps, overall };
            history.unshift(run);
            saveHistory();
            renderHistory();
            renderDashboard();
            populateChartSelect();
            alert(`✅ Run saved (${history.length} total). Overall: ${overall.toUpperCase()}`);
        }

        function renderHistory() {
            const container = document.getElementById('historyContainer');
            if (!history.length) {
                container.innerHTML =
                    `<div class="no-history"><span class="big-icon">📭</span>No saved runs yet.</div>`;
                return;
            }
            let html = `<div class="table-wrap"><table class="history-table"><thead><tr>
              <th>#</th><th>Date</th><th>Machine</th><th>Tech</th><th>Overall</th><th>Actions</th>
            </tr></thead><tbody>`;
            history.forEach((run, idx) => {
                const cls = run.overall === 'pass' ? 'pass' : run.overall === 'fail' ? 'fail' : 'partial';
                html += `<tr>
              <td>${idx+1}</td><td>${run.date||'—'}</td><td>${run.machineId||'—'}</td>
              <td>${run.tech||'—'}</td>
              <td><span class="status-badge ${cls}">${run.overall.toUpperCase()}</span></td>
              <td>
                <button class="btn-sm" onclick="loadRun('${run.id}')">📂 Load</button>
                <button class="btn-sm danger" onclick="deleteRun('${run.id}')">🗑</button>
              </td>
            </tr>`;
            });
            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }

        window.loadRun = function(runId) {
            const run = history.find(r => r.id === runId);
            if (!run) return;
            if (!confirm(`Load run from ${run.date} by ${run.tech}?`)) return;
            STEPS.forEach(s => {
                const data = run.steps[s.id];
                if (data) stepValues[s.id] = { value: data.value, notes: data.notes || '', status: data.status ||
                        'pending', timestamp: run.timestamp };
            });
            saveStepValues();
            renderStep(currentStepIndex);
            updateSidebarStatus();
            updateHeaderSummary();
            renderHistory();
            renderDashboard();
            populateChartSelect();
        };

        window.deleteRun = function(runId) {
            if (!confirm('Delete this run?')) return;
            history = history.filter(r => r.id !== runId);
            saveHistory();
            renderHistory();
            renderDashboard();
            populateChartSelect();
        };

        document.getElementById('clearHistoryBtn').addEventListener('click', () => {
            if (!history.length) return;
            if (!confirm('Delete ALL saved runs?')) return;
            history = [];
            saveHistory();
            renderHistory();
            renderDashboard();
            populateChartSelect();
        });

        document.getElementById('exportCsvBtn').addEventListener('click', () => {
            if (!history.length) { alert('No history to export.'); return; }
            let csv = 'Run,Date,Machine,Tech,Overall,';
            const ids = STEPS.map(s => s.id);
            csv += ids.map(id => `${id}_value`).join(',') + ',';
            csv += ids.map(id => `${id}_status`).join(',') + '\n';
            history.forEach((run, i) => {
                const row = [`"${i+1}"`, `"${run.date}"`, `"${run.machineId}"`, `"${run.tech}"`, `"${run.overall}"`];
                ids.forEach(id => { const d = run.steps[id] || {};
                    row.push(d.value !== undefined ? d.value : ''); });
                ids.forEach(id => { const d = run.steps[id] || {};
                    row.push(d.status || ''); });
                csv += row.join(',') + '\n';
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `feeder_align_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(a.href);
        });

        document.getElementById('saveRunBtn').addEventListener('click', addHistoryRun);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  DASHBOARD
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function renderDashboard() {
            const grid = document.getElementById('statsGrid');
            const total = history.length;
            const pass = history.filter(r => r.overall === 'pass').length;
            const fail = history.filter(r => r.overall === 'fail').length;
            const partial = history.filter(r => r.overall === 'partial').length;
            grid.innerHTML = `
            <div class="stat-card"><div class="num">${total}</div><div class="label">Total Runs</div></div>
            <div class="stat-card"><div class="num green">${pass}</div><div class="label">✅ Pass</div></div>
            <div class="stat-card"><div class="num red">${fail}</div><div class="label">❌ Fail</div></div>
            <div class="stat-card"><div class="num amber">${partial}</div><div class="label">⚠️ Partial</div></div>
          `;
            renderChart();
        }

        function populateChartSelect() {
            const select = document.getElementById('chartStepSelect');
            const current = select.value;
            select.innerHTML = '';
            STEPS.forEach(s => {
                if (!s.isMeasurable) return;
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = s.label.replace(/^[\d]+\.\s*/, '');
                select.appendChild(opt);
            });
            if (current && [...select.options].some(o => o.value === current)) select.value = current;
        }

        function renderChart() {
            const canvas = document.getElementById('trendChart');
            const ctx = canvas.getContext('2d');
            const stepId = document.getElementById('chartStepSelect').value;
            if (chartInstance) { chartInstance.destroy();
                chartInstance = null; }
            if (!history.length || !stepId) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#94a3b8';
                ctx.font = '14px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText('No data to display', canvas.width / 2, canvas.height / 2);
                return;
            }
            const step = STEPS.find(s => s.id === stepId);
            if (!step) return;
            const runs = history.slice(0, 20).reverse();
            const labels = [],
                dataPoints = [],
                colors = [];
            runs.forEach(run => {
                const d = run.steps[stepId];
                if (!d) return;
                const val = d.value;
                if (val === undefined || val === null || isNaN(parseFloat(val))) return;
                labels.push(run.date || '');
                dataPoints.push(parseFloat(val));
                colors.push(d.status === 'pass' ? '#22c55e' : d.status === 'fail' ? '#ef4444' : '#f59e0b');
            });
            if (!dataPoints.length) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#94a3b8';
                ctx.font = '14px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText('No valid numeric data', canvas.width / 2, canvas.height / 2);
                return;
            }
            const w = canvas.width,
                h = canvas.height,
                pad = { top: 20, bottom: 30, left: 50, right: 20 };
            const chartW = w - pad.left - pad.right,
                chartH = h - pad.top - pad.bottom;
            const gap = chartW / dataPoints.length,
                barW = Math.min(30, gap * 0.7);
            const minVal = Math.min(step.min || 0, ...dataPoints) - 1;
            const maxVal = Math.max(step.max || 100, ...dataPoints) + 1;
            const range = maxVal - minVal || 1;
            ctx.clearRect(0, 0, w, h);
            ctx.strokeStyle = '#d1d9e6';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(pad.left, pad.top);
            ctx.lineTo(pad.left, pad.top + chartH);
            ctx.lineTo(pad.left + chartW, pad.top + chartH);
            ctx.stroke();
            if (step.target !== undefined) {
                const yT = pad.top + chartH - ((step.target - minVal) / range) * chartH;
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(pad.left, yT);
                ctx.lineTo(pad.left + chartW, yT);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = '#3b82f6';
                ctx.font = '10px system-ui';
                ctx.textAlign = 'left';
                ctx.fillText(`target ${step.target}`, pad.left + chartW - 70, yT - 4);
            }
            dataPoints.forEach((val, i) => {
                const x = pad.left + i * gap + (gap - barW) / 2;
                const y = pad.top + chartH - ((val - minVal) / range) * chartH;
                ctx.fillStyle = colors[i] || '#94a3b8';
                ctx.fillRect(x, y, barW, pad.top + chartH - y);
                ctx.fillStyle = '#1e293b';
                ctx.font = '9px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText(val.toFixed(1), x + barW / 2, y - 4);
                ctx.fillStyle = '#64748b';
                ctx.font = '8px system-ui';
                const label = labels[i] || '';
                ctx.fillText(label.length > 8 ? label.slice(0,6)+'…' : label, x + barW/2, pad.top + chartH + 16);
            });
            ctx.fillStyle = '#94a3b8';
            ctx.font = '9px system-ui';
            ctx.textAlign = 'right';
            ctx.fillText(maxVal.toFixed(1), pad.left - 6, pad.top + 4);
            ctx.fillText(minVal.toFixed(1), pad.left - 6, pad.top + chartH + 4);
            // legend
            const ly = 6;
            ctx.font = '10px system-ui';
            ctx.textAlign = 'left';
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(pad.left + 10, ly + 2, 12, 12);
            ctx.fillStyle = '#1e293b';
            ctx.fillText('Pass', pad.left + 26, ly + 12);
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(pad.left + 80, ly + 2, 12, 12);
            ctx.fillText('Fail', pad.left + 96, ly + 12);
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(pad.left + 150, ly + 2, 12, 12);
            ctx.fillText('Partial', pad.left + 166, ly + 12);
            ctx.fillStyle = '#0f172a';
            ctx.font = '12px system-ui';
            ctx.textAlign = 'center';
            ctx.fillText(step.label.replace(/^[\d]+\.\s*/, ''), w / 2, 14);
        }

        document.getElementById('chartStepSelect').addEventListener('change', renderChart);
        document.getElementById('chartMetricSelect').addEventListener('change', renderChart);

        document.getElementById('exportJsonBtn').addEventListener('click', () => {
            const data = { exported: new Date().toISOString(), runs: history };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `feeder_align_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(a.href);
        });
        document.getElementById('importJsonBtn').addEventListener('click', () => document.getElementById('importFileInput')
        .click());
        document.getElementById('importFileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (data.runs && Array.isArray(data.runs)) {
                        history = data.runs;
                        saveHistory();
                        renderHistory();
                        renderDashboard();
                        populateChartSelect();
                        alert(`✅ Imported ${history.length} runs.`);
                    } else alert('❌ Invalid file format.');
                } catch (err) { alert('❌ Error reading file.'); }
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        document.querySelectorAll('.tabs button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const tab = btn.dataset.tab;
                document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                document.getElementById(`tab-${tab}`).classList.add('active');
                if (tab === 'dashboard') renderDashboard();
                if (tab === 'history') renderHistory();
            });
        });

        function bindEvents() {
            let timer;
            window.addEventListener('resize', () => {
                clearTimeout(timer);
                timer = setTimeout(() => {
                    if (document.getElementById('tab-dashboard').classList.contains('active')) renderChart();
                }, 300);
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.shiftKey && (e.key === 's' || e.key === 'S')) { e.preventDefault();
                document.getElementById('saveRunBtn').click(); }
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'ArrowLeft') { const b = document.getElementById('prevStepBtn'); if (b && !b.disabled) b.click(); }
            if (e.key === 'ArrowRight') { const b = document.getElementById('nextStepBtn'); if (b && !b.disabled) b.click(); }
        });

        renderStep(0);
        updateSidebarActive();
        updateHeaderSummary();
        console.log('🔧 Feeder Alignment Tool loaded.');
        console.log(`📋 ${STEPS.length} steps defined.`);
        console.log(`📊 ${history.length} historical runs.`);
    </script>
	<!-- ============ Historian client (v2) ============ -->
	<script>
	(function(){
	    const EV_KEY  = 'historian_events_v1';
	    const REG_KEY = 'historian_registry_v1';
	    const MHTS_ACRONYMS = ['DBCS','DIOSS','CIOSS'];
	    const KNOWN_ACRONYMS = ['DBCS','DIOSS','CIOSS','DBS','ASD','HSTS','STRAP','ATU','RACK','ADMIN','EMARS'];
	    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
	    const norm = s => (s || '').replace(/\s+/g,' ').trim();
	    function readAll(){ try { const r = localStorage.getItem(EV_KEY); return r ? JSON.parse(r) : []; } catch(e){ return []; } }
	    function writeAll(arr){ try { localStorage.setItem(EV_KEY, JSON.stringify(arr)); return true; } catch(e){ alert('Historian storage error: ' + e.message); return false; } }
	    function readReg(){ try { const r = localStorage.getItem(REG_KEY); return r ? JSON.parse(r) : {}; } catch(e){ return {}; } }
	    function writeReg(r){ try { localStorage.setItem(REG_KEY, JSON.stringify(r)); return true; } catch(e){ return false; } }
	    function parseMachineId(raw){
	        if (!raw) return null;
	        const m = String(raw).trim().match(/^([A-Za-z]+)[\s\-_]*0*(\d+)$/);
	        if (!m) return null;
	        return { acronym: m[1].toUpperCase(), mno: String(parseInt(m[2],10)) };
	    }
	    function canonicalId(acronym, mno){ return `${acronym} ${mno}`; }
	    window.historianGetRegistry     = readReg;
	    window.historianSaveRegistry    = writeReg;
	    window.historianParseMachineId  = parseMachineId;
	    window.historianCanonicalId     = canonicalId;
	    window.historianKnownAcronyms   = KNOWN_ACRONYMS;
	    window.historianMhtsAcronyms    = MHTS_ACRONYMS;
	    window.historianRegisterMno = function(mno, acronym){
	        const reg = readReg();
	        reg[String(parseInt(mno,10))] = String(acronym).toUpperCase();
	        writeReg(reg);
	    };
	    window.historianPromptForMnOs = function(unknownMnos, acronymList){
	        const list = (acronymList && acronymList.length) ? acronymList : MHTS_ACRONYMS;
	        return new Promise((resolve) => {
	            const ov = document.createElement('div');
	            ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99998;display:flex;align-items:center;justify-content:center;font:13px/1.5 system-ui,sans-serif;';
	            const box = document.createElement('div');
	            box.style.cssText = 'background:#fff;border-radius:12px;padding:20px 24px;max-width:520px;width:92%;box-shadow:0 12px 40px rgba(0,0,0,.3);max-height:85vh;overflow:auto;';
	            let rowsHtml = '';
	            unknownMnos.forEach(m => {
	                rowsHtml += `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eef2f6;"><div style="font-weight:700;min-width:70px;color:#0b3d91;">MNO ${m}</div><select data-mno="${m}" style="flex:1;padding:6px 10px;border:1px solid #b9c8dc;border-radius:6px;font:13px inherit;"><option value="">— skip this machine —</option>${list.map(a=>`<option value="${a}">${a}</option>`).join('')}</select></div>`;
	            });
	            box.innerHTML = `<h3 style="margin:0 0 6px;color:#0b3d91;font-size:16px;">Assign machine types</h3><p style="margin:0 0 14px;color:#5b6b80;font-size:12.5px;">These MNOs aren't in the registry yet.</p><div>${rowsHtml}</div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;"><button id="__hCancel" style="background:#fff;color:#0b3d91;border:1px solid #b9c8dc;border-radius:6px;padding:7px 16px;font:600 13px inherit;cursor:pointer;">Cancel</button><button id="__hOK" style="background:#0b3d91;color:#fff;border:0;border-radius:6px;padding:7px 18px;font:600 13px inherit;cursor:pointer;">Save assignments</button></div>`;
	            ov.appendChild(box); document.body.appendChild(ov);
	            ov.querySelector('#__hCancel').onclick = () => { document.body.removeChild(ov); resolve({}); };
	            ov.querySelector('#__hOK').onclick = () => { const out = {}; box.querySelectorAll('select[data-mno]').forEach(sel => { if (sel.value) out[sel.dataset.mno] = sel.value; }); document.body.removeChild(ov); resolve(out); };
	        });
	    };
	    window.historianSave = function(ev){
	        ev.id = ev.id || uid();
	        ev.capturedAt = new Date().toISOString();
	        if (ev.payload && ev.payload.rawMno){
	            const mno = String(parseInt(ev.payload.rawMno, 10));
	            const reg = readReg();
	            const acronym = reg[mno] || ev.payload.acronymHint || null;
	            if (acronym){ ev.machineId = canonicalId(acronym, mno); ev.machineResolved = true; }
	            else { ev.machineId = 'MNO ' + mno; ev.machineResolved = false; }
	        } else if (ev.machineId){
	            const p = parseMachineId(ev.machineId);
	            if (p){
	                ev.machineId = canonicalId(p.acronym, p.mno);
	                const reg = readReg();
	                if (!reg[p.mno]) { reg[p.mno] = p.acronym; writeReg(reg); }
	                ev.machineResolved = true;
	            }
	        }
	        ev.detId = [ev.source||'', ev.machineId||'', ev.eventTime||'', ev.kind||'', norm(ev.summary||'')].join('|');
	        const all = readAll();
	        const i = all.findIndex(x => (x.detId||x.id) === ev.detId);
	        if (i >= 0){ all[i] = Object.assign({}, all[i], ev); writeAll(all); return { action:'updated', total: all.length, machineId: ev.machineId }; }
	        all.push(ev); writeAll(all);
	        return { action:'added', total: all.length, machineId: ev.machineId };
	    };
	    window.historianOpen = function(){ window.open('historian.html','historian'); };
	    window.historianToast = function(msg, ok){
	        let el = document.getElementById('__histToast');
	        if (!el){
	            el = document.createElement('div');
	            el.id = '__histToast';
	            el.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:99999;padding:10px 16px;border-radius:8px;font:600 13px/1.4 system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.2);color:#fff;transition:opacity .3s;';
	            document.body.appendChild(el);
	        }
	        el.style.background = ok === false ? '#b3261e' : '#1b5e20';
	        el.textContent = msg;
	        el.style.opacity = '1';
	        clearTimeout(el._t);
	        el._t = setTimeout(() => { el.style.opacity = '0'; }, 2600);
	    };
	})();
	</script>

</body>
